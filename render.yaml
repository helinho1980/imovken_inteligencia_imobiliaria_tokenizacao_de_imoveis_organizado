services:
  - type: web
    name: imovken-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: node server/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/imovken.db
